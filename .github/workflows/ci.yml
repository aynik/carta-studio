name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  porffor-codegen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pinned Porffor alpha-19
        run: node Tools/fetch_porffor.mjs
      - name: Emit Porffor C sources (codecs + NetMD)
        run: |
          node Tools/build_porffor_codecs.mjs --emit-c-only
          node Tools/build_porffor_netmd.mjs --emit-c-only
      - name: Upload generated C sources
        uses: actions/upload-artifact@v4
        with:
          name: porffor-generated-c
          path: build/porffor/generated/*.c
          retention-days: 1

  desktop:
    needs: porffor-codegen
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download Porffor generated C sources
        uses: actions/download-artifact@v4
        with:
          name: porffor-generated-c
          path: build/porffor/generated

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libusb-1.0-0-dev libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libgtk-3-dev xvfb xauth openbox x11-utils xdotool ffmpeg

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libusb
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || brew install ffmpeg

      - name: Install Windows libusb-1.0
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/libusb-win64 | Out-Null
          Invoke-WebRequest -Uri "https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z" -OutFile "build/libusb-1.0.27.7z"
          7z x "build/libusb-1.0.27.7z" -o"build/libusb-win64" -y | Out-Null

      - name: Compile Porffor native libraries
        run: |
          node Tools/build_porffor_codecs.mjs --compile-only
          node Tools/build_porffor_netmd.mjs --compile-only

      - name: Configure (macOS / Linux)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCARTA_STUDIO_COMPONENT_TESTS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libusbRoot = (Resolve-Path "build/libusb-win64").Path
          cmake -S . -B build `
            -DCARTA_STUDIO_COMPONENT_TESTS=OFF `
            -DCARTA_LIBUSB_INCLUDE_DIR="$libusbRoot/include" `
            -DCARTA_LIBUSB_LIBRARY="$libusbRoot/VS2022/MS64/dll/libusb-1.0.lib" `
            -DCARTA_LIBUSB_DLL="$libusbRoot/VS2022/MS64/dll/libusb-1.0.dll"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test on macOS
        if: runner.os == 'macOS'
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Test IPC on macOS
        if: runner.os == 'macOS'
        run: |
          binary="build/CartaStudio_artefacts/Carta Studio.app/Contents/MacOS/Carta Studio"
          if [ ! -f "$binary" ]; then binary="build/CartaStudio_artefacts/Release/Carta Studio.app/Contents/MacOS/Carta Studio"; fi
          python3 Tests/ipc_smoke.py "$binary"
          python3 Tests/ipc_md_authoring_test.py "$binary"
          python3 Tests/ipc_paste_test.py "$binary"
          python3 Tests/ipc_project_relink_test.py "$binary"
          python3 Tests/ipc_source_scope_test.py "$binary"
          python3 Tests/ipc_multichannel_consolidate_test.py "$binary"
          python3 Tests/ipc_long_marker_test.py "$binary"
          python3 Tests/ipc_marker_title_import_test.py "$binary"
          python3 Tests/path_smoke.py "$binary"
          python3 Tests/ffmpeg_wav_check.py "$binary"

      - name: Test on Linux with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 Tests/run_linux_ui_tests.py build --ipc --ffmpeg

      - name: Test on Windows
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
